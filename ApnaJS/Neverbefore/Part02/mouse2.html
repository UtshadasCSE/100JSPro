<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        position: relative;
        overflow: hidden;
      }
      .container {
        position: absolute;
        margin: 1rem;
        width: 300px;
        height: 300px;
        background: rgba(73, 218, 128, 0.575);
        border-radius: 0.4rem;
        transition: all cubic-bezier(0.19, 1, 0.22, 1);
      }
    </style>
  </head>
  <body>
    <div class="container"></div>
    <script>
      let container = document.querySelector(".container");

      container.addEventListener("click", (details) => {
        console.log(details);
      });
    </script>
  </body>
</html>
