<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      header {
        background: #333;
        color: #fff;
        padding: 1rem;
      }
      .line-through {
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <header>
      <ul>
        <li>Home</li>
        <li>About</li>
        <li>Contact</li>
        <button>Shop Now</button>
      </ul>
    </header>

    <script>
      let header = document.querySelector("header");
      header.addEventListener("click", (details) => {
        details.target.classList.toggle("line-through");
      });
    </script>
  </body>
</html>
